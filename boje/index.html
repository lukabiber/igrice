<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boje</title>
<meta name="description" content="Learn colors in English and Croatian: splash paint, then find the right balloon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15182F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brunoli">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Two ways to play with colors.
   Paint: tap anywhere, a paint splat lands under the finger and the voice names its color.
   Find: two (later three) balloons; the voice asks for one; the right one pops.
   Grown-up controls live on the start card and the hold-to-exit house button, like Prstići. */
:root{
  --paper:#F4F6FC;
  --ink:#23284F;
  --ink-soft:#5A6192;
  --card:#FFFFFF;
  --line:#D9DEF0;
  --sticker:#FFFFFF;
  --go:#E5484D;
  --on-go:#FFFFFF;
  --ok:#2E9E5B;
  --warn:#D98A00;
  --tint:16%;
  --cur:#9AA3C7;
  --font-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15182F; --ink:#F2F1FF; --ink-soft:#A7ABD8; --card:#20244A; --line:#343A6A;
    --sticker:#15182F; --ok:#4CC27E; --warn:#F2B13C; --tint:26%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15182F; --ink:#F2F1FF; --ink-soft:#A7ABD8; --card:#20244A; --line:#343A6A;
  --sticker:#15182F; --ok:#4CC27E; --warn:#F2B13C; --tint:26%;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--paper);
  background:color-mix(in srgb,var(--cur) var(--tint),var(--paper));
  color:var(--ink);font-family:var(--font-body);
  transition:background-color .6s ease;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- paint layer (behind everything) ---------- */
.paint{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.splat{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);transform:rotate(var(--r));animation:splat .45s cubic-bezier(.3,1.5,.5,1) both;transition:opacity .6s ease}
.splat svg{display:block;width:100%;height:100%;overflow:visible}
.splat .p{stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.splat.old{opacity:0}
@keyframes splat{from{transform:rotate(var(--r)) scale(.15)}to{transform:rotate(var(--r)) scale(1)}}

/* ---------- game stage ---------- */
.app{
  position:relative;z-index:1;height:100%;display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top" "stage" "words";
  align-items:center;justify-items:center;row-gap:8px;
  padding-top:calc(6px + env(safe-area-inset-top,0px));
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  cursor:pointer;
}
.top{grid-area:top;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.home{position:relative;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);cursor:pointer;touch-action:none}
.home svg{display:block;width:100%;height:100%}
.home .ring-bg{fill:none;stroke:var(--line);stroke-width:3}
.home .ring{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:132;stroke-dashoffset:132;transform:rotate(-90deg);transform-origin:24px 24px;transition:stroke-dashoffset .15s ease}
.home.holding .ring{stroke-dashoffset:0;transition:stroke-dashoffset .9s linear}
.home .house{fill:var(--ink-soft)}
.mode{font:800 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);background:var(--card);padding:9px 12px;border-radius:999px}

.stage{grid-area:stage;position:relative;width:100%;height:100%;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,5vw,40px)}
.tapme{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.stage.empty .tapme{display:grid}
.tapme i{grid-area:1/1;width:min(32vh,62vw);aspect-ratio:1;border-radius:50%;border:7px solid var(--c);opacity:0;animation:ping 2.4s ease-out infinite}
.tapme i:nth-child(1){--c:#E8262E}
.tapme i:nth-child(2){--c:#FFD21F;animation-delay:.8s}
.tapme i:nth-child(3){--c:#2D7FF9;animation-delay:1.6s}
.tapme b{grid-area:1/1;width:min(9vh,16vw);aspect-ratio:1;border-radius:50%;background:#3DB54A;border:6px solid var(--sticker);animation:bob 1.2s ease-in-out infinite alternate}
@keyframes ping{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes bob{to{transform:scale(1.15)}}

.balloon{appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;flex:0 0 auto;width:min(40vw,30vh,230px);touch-action:manipulation;animation:rise .7s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms)}
.stage.three .balloon{width:min(26vw,24vh,180px)}
.balloon svg{display:block;width:100%;height:auto;overflow:visible;animation:float 2.4s ease-in-out infinite alternate;animation-delay:var(--b,0s)}
.balloon .body,.balloon .knot{stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.balloon .string{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.balloon.wiggle svg{animation:wiggle .5s ease-in-out}
.balloon.hint svg{animation:hint 1s ease-in-out infinite}
.balloon.pop{animation:popped .3s ease-out forwards;pointer-events:none}
@keyframes rise{from{transform:translateY(70vh)}to{transform:none}}
@keyframes float{from{transform:translateY(-6px) rotate(-2deg)}to{transform:translateY(6px) rotate(2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}
@keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes popped{to{transform:scale(1.35);opacity:0}}

.words{grid-area:words;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:4px 28px;min-height:clamp(52px,9vh,84px);text-align:center}
.word{display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.word small{font:800 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.word b{font:800 clamp(34px,6.6vh,60px)/1 var(--font-display);color:var(--c);-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill}
.word .q{font:800 clamp(26px,5vh,44px)/1.1 var(--font-display);color:var(--ink)}
.word .q b{font-size:1.2em}
.word.on{transform:scale(1.12)}
.hint{font:800 clamp(28px,5.6vh,48px)/1 var(--font-display);color:var(--ink-soft)}

@media (orientation:landscape) and (max-height:600px){
  .balloon{width:min(24vw,46vh,200px)}
  .stage.three .balloon{width:min(20vw,40vh,170px)}
  .words{min-height:44px}
}

/* ---------- celebration ---------- */
.bravo{position:fixed;inset:0;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(22vh + env(safe-area-inset-top,0px));pointer-events:none;opacity:0}
.bravo.show{animation:bravo 2.8s ease forwards}
@keyframes bravo{0%,80%{opacity:1}100%{opacity:0}}
.bravo span{display:inline-block;font:800 clamp(72px,24vw,170px)/1 var(--font-display);color:var(--c);-webkit-text-stroke:.08em var(--sticker);paint-order:stroke fill;animation:hop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes hop{0%{transform:translateY(40px) scale(.2) rotate(-12deg)}100%{transform:none}}
.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none}

/* ---------- start card (for the grown-up) ---------- */
.start{
  position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--paper);
  display:flex;flex-direction:column;cursor:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.card{margin:auto;width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:8px 16px 8px 8px;border-radius:999px;background:var(--card);border:2px solid var(--line);font:800 15px/1 var(--font-body);color:var(--ink);text-decoration:none;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.back:active{transform:translateY(1px)}
.demo{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:150px}
.demo svg{height:100%;width:auto;overflow:visible;animation:float 2.4s ease-in-out infinite alternate}
.demo svg:nth-child(2){height:88%;animation-delay:-.8s}
.demo svg:nth-child(3){height:94%;animation-delay:-1.6s}
.demo .body,.demo .knot{stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.demo .string{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.brand h1{margin:0;font:800 clamp(60px,17vw,88px)/.9 var(--font-display);letter-spacing:-.01em}
.brand h1 span{color:var(--c);-webkit-text-stroke:.07em var(--sticker);paint-order:stroke fill}
.brand p{margin:0;font:600 17px/1.35 var(--font-body);color:var(--ink-soft);text-wrap:balance}
.brand p b{font-weight:800;color:var(--ink)}
fieldset{border:0;margin:0;padding:0;min-width:0;width:100%;display:flex;flex-direction:column;gap:10px}
legend{padding:0;margin:0 auto 10px;font:800 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg label{position:relative;display:block}
.seg input{position:absolute;inset:0;margin:0;opacity:0}
.seg span{display:flex;align-items:center;justify-content:center;min-height:56px;padding:6px 8px;border-radius:18px;background:var(--card);border:2px solid var(--line);font:800 15px/1.15 var(--font-body);color:var(--ink);cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.seg input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.seg input:focus-visible + span{outline:3px solid var(--go);outline-offset:2px}
.modes{width:100%;display:grid;gap:12px}
.go{width:100%;min-height:66px;border:0;border-radius:999px;background:var(--go);color:var(--on-go);font:800 28px/1 var(--font-display);box-shadow:0 5px 0 color-mix(in srgb,var(--go) 60%,#000);cursor:pointer;transition:transform .08s ease,box-shadow .08s ease}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--go) 60%,#000)}
.go.paint{--go:#2D7FF9}
.go.find{--go:#E5484D}
.voices{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.voices li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:baseline;font:600 14px/1.4 var(--font-body);color:var(--ink-soft)}
.voices li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ok);transform:translateY(1px)}
.voices li.warn::before{background:var(--warn)}
.voices li b{color:var(--ink);font-weight:800}
.tips{margin:0;font:600 14px/1.45 var(--font-body);color:var(--ink-soft);max-width:38ch;text-wrap:pretty}
.tips b{color:var(--ink);font-weight:800}

@media (prefers-reduced-motion:reduce){
  .splat,.balloon,.balloon svg,.demo svg,.tapme i,.tapme b,.bravo span{animation:none!important}
  .balloon.pop{opacity:0}
  .tapme i{opacity:.5}
  .tapme i:nth-child(n+2){display:none}
}
</style>
</head>
<body>

<div class="paint" id="paint" aria-hidden="true"></div>

<main class="app" id="app" aria-label="Colors game">
  <div class="top">
    <button class="home" id="home" type="button" aria-label="Hold to go back to the start screen">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle class="ring-bg" cx="24" cy="24" r="21"/><circle class="ring" cx="24" cy="24" r="21"/><path class="house" d="M14 24 24 15l10 9v9.5a1.5 1.5 0 0 1-1.5 1.5H28v-7h-8v7h-4.5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
    </button>
    <span class="mode" id="mode">English + Hrvatski</span>
  </div>
  <div class="stage empty" id="stage"></div>
  <div class="words" id="words"></div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>
<div class="bravo" id="bravo" aria-hidden="true"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<section class="start" id="start" aria-labelledby="title">
  <a class="back" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>All games · Sve igre</a>
  <div class="card">
    <div class="demo" id="demo" aria-hidden="true"></div>
    <div class="brand">
      <h1 id="title" aria-label="Boje"></h1>
      <p><b>Learn colors by painting and finding.</b><br>Učimo boje.</p>
    </div>
    <fieldset>
      <legend>Language · Jezik</legend>
      <div class="seg">
        <label><input type="radio" name="lang" id="lang-en" value="en"><span>English</span></label>
        <label><input type="radio" name="lang" id="lang-hr" value="hr"><span>Hrvatski</span></label>
        <label><input type="radio" name="lang" id="lang-both" value="both" checked><span>Both · Oboje</span></label>
      </div>
    </fieldset>
    <div class="modes">
      <button class="go paint" id="go-paint" type="button">Paint · Slikaj</button>
      <button class="go find" id="go-find" type="button">Find · Nađi</button>
    </div>
    <ul class="voices" id="voices"></ul>
    <p class="tips"><b>Paint:</b> tap anywhere to splash a color and hear its name. <b>Find:</b> tap the balloon the voice asks for. Hold the house button for a second to come back here.</p>
  </div>
</section>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;

  // sound: how the English voice should read the Croatian when the phone has no Croatian voice.
  const COLORS = [
    { en: 'red',    hr: 'crvena',     sound: 'Tsurvena',     c: '#E8262E' },
    { en: 'yellow', hr: 'žuta',       sound: 'Zhoota',       c: '#FFD21F' },
    { en: 'blue',   hr: 'plava',      sound: 'Plava',        c: '#2D7FF9' },
    { en: 'green',  hr: 'zelena',     sound: 'Zelena',       c: '#3DB54A' },
    { en: 'orange', hr: 'narančasta', sound: 'Naranchasta',  c: '#FF8A1F' },
    { en: 'purple', hr: 'ljubičasta', sound: 'Lyoobichasta', c: '#8E4FE0' },
    { en: 'pink',   hr: 'roza',       sound: 'Roza',         c: '#FF6FB5' },
    { en: 'brown',  hr: 'smeđa',      sound: 'Smedja',       c: '#8B5A2B' },
    { en: 'black',  hr: 'crna',       sound: 'Tsurna',       c: '#26262B' },
    { en: 'white',  hr: 'bijela',     sound: 'Biyela',       c: '#FFFFFF' },
  ];
  const NEUTRAL = '#9AA3C7';
  const PARTY = ['#E8262E', '#FF8A1F', '#FFD21F', '#3DB54A', '#2D7FF9', '#8E4FE0'];
  const LANG_LABEL = { en: 'English', hr: 'Hrvatski', both: 'English + Hrvatski' };
  const HINT = { en: 'Tap!', hr: 'Dodirni!', both: 'Tap! · Dodirni!' };
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // Every spoken line: English, Croatian, and the phonetic Croatian for an English voice.
  const NAME  = { en: (c) => c.en, hr: (c) => c.hr, sound: (c) => c.sound };
  const ASK   = { en: (c) => `Where is ${c.en}?`, hr: (c) => `Gdje je ${c.hr}?`, sound: (c) => `${c.sound}?` };
  const YES   = { en: (c) => `Yes! ${cap(c.en)}!`, hr: (c) => `Bravo! ${cap(c.hr)}!`, sound: (c) => `Bravo! ${c.sound}!` };
  const NO    = { en: (c) => `That's ${c.en}.`, hr: (c) => `To je ${c.hr}.`, sound: (c) => `${c.sound}.` };
  const PAINT = { en: () => "Let's paint!", hr: () => 'Slikajmo!', sound: () => 'Sleekaimo!' };
  const CHEER = { en: () => 'Great job!', hr: () => 'Bravo!', sound: () => 'Bravo!' };

  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ---------- drawings ---------- */
  function balloonSVG(fill) {
    return `<svg viewBox="0 0 160 250" aria-hidden="true">` +
      `<path class="string" d="M80 178 C68 200 94 220 78 248"/>` +
      `<ellipse class="body" cx="80" cy="88" rx="66" ry="80" fill="${fill}"/>` +
      `<path class="knot" d="M70 180 L90 180 L80 166 Z" fill="${fill}"/>` +
      `<ellipse cx="54" cy="56" rx="12" ry="22" transform="rotate(-24 54 56)" fill="#FFFFFF" opacity=".45"/>` +
    `</svg>`;
  }
  function blobPath(cx, cy, r, n, jitter) {
    const f = (v) => v.toFixed(1);
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.25;
      const rr = r * (1 - jitter + Math.random() * jitter * 2);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const s = mid(pts[n - 1], pts[0]);
    let d = `M${f(s[0])} ${f(s[1])}`;
    for (let i = 0; i < n; i++) {
      const p = pts[i], m = mid(p, pts[(i + 1) % n]);
      d += ` Q${f(p[0])} ${f(p[1])} ${f(m[0])} ${f(m[1])}`;
    }
    return d + 'Z';
  }
  function splatSVG(fill) {
    let drops = '';
    const k = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < k; i++) {
      const a = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 14, r = 6 + Math.random() * 7;
      drops += `<circle class="p" cx="${(100 + Math.cos(a) * dist).toFixed(1)}" cy="${(100 + Math.sin(a) * dist).toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}"/>`;
    }
    return `<svg viewBox="0 0 200 200" aria-hidden="true"><path class="p" d="${blobPath(100, 100, 60, 11, 0.24)}" fill="${fill}"/>${drops}</svg>`;
  }

  $('#demo').innerHTML = ['#E8262E', '#FFD21F', '#2D7FF9'].map(balloonSVG).join('');
  $('#title').innerHTML = [...'Boje'].map((ch, i) =>
    `<span aria-hidden="true" style="--c:${['#E8262E', '#2D7FF9', '#3DB54A', '#8E4FE0'][i]}">${ch}</span>`).join('');

  /* ---------- voices ---------- */
  const voices = { en: null, hr: null };
  const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
  const GOOD = {
    en: /samantha|ava|allison|susan|karen|serena|moira|tessa|kate|daniel|martha|zoe|aria|jenny|emma|google us english/i,
    hr: /lana|gabrijela|srecko|matej|google/i,
  };
  function bestVoice(code) {
    if (!synth) return null;
    const list = synth.getVoices().filter((v) => (v.lang || '').toLowerCase().replace('_', '-').startsWith(code));
    if (!list.length) return null;
    const score = (v) =>
      (NOVELTY.test(v.name) ? -20 : 0) +
      (/premium|enhanced|natural/i.test(v.name) ? 4 : 0) +
      (GOOD[code].test(v.name) ? 3 : 0) +
      (code === 'en' && /en[-_](us|gb)/i.test(v.lang) ? 2 : 0) +
      (v.localService ? 1 : 0);
    return list.slice().sort((a, b) => score(b) - score(a))[0];
  }
  function shortName(v) { return v.name.split(' - ')[0].replace(/^Microsoft\s+/, ''); }
  function loadVoices() {
    voices.en = bestVoice('en');
    voices.hr = bestVoice('hr');
    const ul = $('#voices');
    ul.textContent = '';
    const row = (ok, label, text) => {
      const li = document.createElement('li');
      if (!ok) li.className = 'warn';
      const span = document.createElement('span');
      const b = document.createElement('b');
      b.textContent = label;
      span.append(b, ' ' + text);
      li.append(span);
      ul.append(li);
    };
    if (!synth) {
      row(false, 'No voice here.', 'This browser cannot speak. On iPhone, open the page in Safari.');
      return;
    }
    row(!!voices.en, 'English voice:', voices.en ? shortName(voices.en) : 'not found on this device.');
    row(!!voices.hr, 'Croatian voice:', voices.hr ? shortName(voices.hr)
      : 'not found, so the English voice reads the Croatian words. For a real Croatian accent, add Lana in Settings → Accessibility → Spoken Content → Voices → Croatian.');
  }
  if (synth) {
    if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices);
    setTimeout(loadVoices, 300);
    setTimeout(loadVoices, 1500);
  }
  loadVoices();

  /* ---------- speech ---------- */
  let busy = false, busyTimer = 0, sayId = 0, queue = [];
  function mark(key) {
    for (const w of $('#words').querySelectorAll('.word')) w.classList.toggle('on', w.dataset.k === key);
  }
  function say(parts, onDone, lock) {
    const id = ++sayId;
    clearTimeout(busyTimer);
    const finish = () => {
      if (id !== sayId) return;
      clearTimeout(busyTimer);
      busy = false;
      mark(null);
      sayId++;
      if (onDone) onDone();
    };
    busy = !!lock;
    busyTimer = setTimeout(finish, synth ? 1300 * parts.length + 300 : 700);
    if (!synth) return;
    const go = () => {
      if (id !== sayId) return;
      queue = parts.map((part, i) => {
        // No Croatian voice on the phone: the English voice reads the phonetic spelling.
        const fallback = part.lang === 'hr' && !voices.hr && !!voices.en;
        const u = new SpeechSynthesisUtterance(fallback ? part.sound || part.text : part.text);
        const v = fallback ? voices.en : voices[part.lang];
        if (v) u.voice = v;
        u.lang = v ? v.lang : (part.lang === 'hr' ? 'hr-HR' : 'en-US');
        u.rate = 0.85;
        u.pitch = 1.1;
        u.onstart = () => { if (id === sayId) mark(part.lang); };
        if (i === parts.length - 1) { u.onend = finish; u.onerror = finish; }
        return u;
      });
      queue.forEach((u) => synth.speak(u));
    };
    if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(go, 60); } else go();
  }

  /* ---------- shared game bits ---------- */
  const app = $('#app'), stage = $('#stage'), words = $('#words'), live = $('#live');
  const paintEl = $('#paint'), bravo = $('#bravo');
  const TAPME = '<span class="tapme" aria-hidden="true"><i></i><i></i><i></i><b></b></span>';
  let lang = 'both', mode = 'paint', playing = false;
  const langs = () => (lang === 'both' ? ['en', 'hr'] : [lang]);
  const lines = (phrase, c) => langs().map((l) => (l === 'hr'
    ? { text: phrase.hr(c), sound: phrase.sound(c), lang: 'hr' }
    : { text: phrase.en(c), lang: 'en' }));
  const tint = (hex) => root.style.setProperty('--cur', hex);
  const label = (l) => (lang === 'both' ? `<small>${LANG_LABEL[l]}</small>` : '');

  function showName(c) {
    words.innerHTML = langs().map((l) =>
      `<span class="word" data-k="${l}">${label(l)}<b style="--c:${c.c}">${c[l]}</b></span>`).join('');
    live.textContent = langs().map((l) => c[l]).join(', ');
  }
  function showAsk(c) {
    words.innerHTML = langs().map((l) =>
      `<span class="word" data-k="${l}">${label(l)}<span class="q">${l === 'en' ? 'Where is' : 'Gdje je'} <b style="--c:${c.c}">${c[l]}</b>?</span></span>`).join('');
    live.textContent = langs().map((l) => ASK[l](c)).join(' ');
  }
  function showHint() { words.innerHTML = `<span class="hint">${HINT[lang]}</span>`; live.textContent = ''; }

  /* ---------- paint ---------- */
  let order = [], oi = 0, cur = null, splats = [];
  function nextColor() {
    if (oi >= order.length) {
      order = shuffle(COLORS.slice());
      if (cur && order[0] === cur) order.push(order.shift());
      oi = 0;
    }
    return order[oi++];
  }
  function addSplat(x, y, c) {
    const s = Math.min(innerWidth * 0.42, innerHeight * 0.3, 260) * (0.8 + Math.random() * 0.35);
    const el = document.createElement('span');
    el.className = 'splat';
    el.style.cssText = `left:${x}px;top:${y}px;--s:${s.toFixed(0)}px;--r:${Math.floor(Math.random() * 360)}deg`;
    el.innerHTML = splatSVG(c.c);
    paintEl.append(el);
    splats.push(el);
    while (splats.length > 14) {
      const old = splats.shift();
      old.classList.add('old');
      setTimeout(() => old.remove(), 700);
    }
  }
  function paintTap(x, y) {
    // While a color is being named, more taps add more of the same color.
    if (busy && cur) { addSplat(x, y, cur); return; }
    const c = nextColor();
    cur = c;
    tint(c.c);
    stage.classList.remove('empty');
    addSplat(x, y, c);
    showName(c);
    say(lines(NAME, c), null, true);
  }

  /* ---------- find ---------- */
  let target = null, streak = 0, found = 0, locked = false;
  function newRound() {
    if (!playing || mode !== 'find') return;
    const n = streak >= 4 ? 3 : 2;
    target = pick(COLORS.filter((c) => c !== target));
    const set = shuffle([target, ...shuffle(COLORS.filter((c) => c !== target)).slice(0, n - 1)]);
    tint(NEUTRAL);
    stage.classList.remove('empty');
    stage.classList.toggle('three', n === 3);
    stage.textContent = '';
    set.forEach((c, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'balloon';
      b.setAttribute('aria-label', `${c.en} · ${c.hr}`);
      b.style.setProperty('--d', `${i * 90}ms`);
      b.style.setProperty('--b', `${-i * 0.8}s`);
      b.innerHTML = balloonSVG(c.c);
      b.colour = c;
      stage.append(b);
    });
    showAsk(target);
    locked = false;
    say(lines(ASK, target), null, false);
  }
  function balloonTap(b) {
    if (locked || !playing) return;
    const c = b.colour;
    if (c === target) {
      locked = true;
      streak++;
      found++;
      for (const o of stage.querySelectorAll('.balloon')) o.classList.remove('hint');
      const r = b.getBoundingClientRect();
      b.classList.add('pop');
      burst(r.left + r.width / 2, r.top + r.width * 0.55, [c.c, ...PARTY], 70);
      tint(c.c);
      showName(c);
      say(lines(YES, c), () => (found % 5 === 0 ? celebrate(newRound) : setTimeout(newRound, 250)), true);
    } else {
      streak = 0;
      b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle');
      for (const o of stage.querySelectorAll('.balloon')) if (o.colour === target) o.classList.add('hint');
      say(lines(NO, c), null, false);
    }
  }
  stage.addEventListener('click', (e) => {
    const b = e.target.closest('.balloon');
    if (b && mode === 'find') balloonTap(b);
  });
  stage.addEventListener('animationend', (e) => {
    if (e.animationName === 'wiggle') { const b = e.target.closest('.balloon'); if (b) b.classList.remove('wiggle'); }
  });

  function celebrate(next) {
    if (!playing) return;
    bravo.innerHTML = [...'Bravo!'].map((ch, i) => `<span style="--c:${PARTY[i]};--i:${i}">${ch}</span>`).join('');
    bravo.classList.remove('show'); void bravo.offsetWidth; bravo.classList.add('show');
    burst(innerWidth / 2, innerHeight * 0.7, PARTY, 150);
    say(lines(CHEER), () => setTimeout(next, 300), true);
  }

  /* ---------- confetti ---------- */
  const cv = $('#confetti'), cx = cv.getContext('2d');
  let bits = [], craf = 0, clast = 0;
  function sizeCanvas() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y, palette, count) {
    if (reduce) return;
    sizeCanvas();
    for (let i = 0; i < count; i++) {
      bits.push({
        x: x + (Math.random() - 0.5) * 60, y,
        vx: (Math.random() - 0.5) * 10, vy: -(6 + Math.random() * 10),
        s: 5 + Math.random() * 6, c: palette[i % palette.length],
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, round: i % 3 === 0,
      });
    }
    if (!craf) { clast = performance.now(); craf = requestAnimationFrame(drawBits); }
  }
  function drawBits(now) {
    const f = Math.min(3, (now - clast) / 16.67);
    clast = now;
    const H = innerHeight;
    cx.clearRect(0, 0, innerWidth, H);
    bits = bits.filter((b) => b.y < H + 30);
    for (const b of bits) {
      b.vy += 0.32 * f; b.vx *= Math.pow(0.99, f);
      b.x += b.vx * f; b.y += b.vy * f; b.r += b.vr * f;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
      if (b.round) { cx.beginPath(); cx.arc(0, 0, b.s * 0.6, 0, Math.PI * 2); cx.fill(); }
      else cx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      cx.restore();
    }
    craf = bits.length ? requestAnimationFrame(drawBits) : 0;
    if (!craf) cx.clearRect(0, 0, innerWidth, H);
  }

  /* ---------- taps ---------- */
  app.addEventListener('pointerup', (e) => {
    if (!playing || mode !== 'paint' || e.target.closest('.home')) return;
    paintTap(e.clientX, e.clientY);
  });
  app.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (!playing || mode !== 'paint' || e.target.closest('.home')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
      e.preventDefault();
      const r = stage.getBoundingClientRect();
      paintTap(r.left + r.width * (0.2 + Math.random() * 0.6), r.top + r.height * (0.2 + Math.random() * 0.6));
    }
  });

  /* ---------- start / exit ---------- */
  const start = $('#start'), home = $('#home');
  const saved = store.get('brunoli-lang') || store.get('prstici-lang');
  if (saved && LANG_LABEL[saved]) { lang = saved; $('#lang-' + saved).checked = true; }

  let wake = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); }
    catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', () => { if (playing && document.visibilityState === 'visible') keepAwake(); });

  function reset() {
    paintEl.textContent = '';
    splats = []; cur = null; order = []; oi = 0;
    target = null; streak = 0; found = 0; locked = false;
    stage.innerHTML = TAPME;
    stage.classList.add('empty');
    stage.classList.remove('three');
    bravo.classList.remove('show');
    tint(NEUTRAL);
  }
  function begin(m) {
    lang = (document.querySelector('input[name="lang"]:checked') || {}).value || 'both';
    store.set('brunoli-lang', lang);
    mode = m;
    app.dataset.mode = m;
    $('#mode').textContent = LANG_LABEL[lang];
    reset();
    playing = true;
    start.hidden = true;
    // The first speech has to start inside this tap, or iPhone keeps it silent.
    if (m === 'paint') { showHint(); say(lines(PAINT), null, false); }
    else newRound();
    keepAwake();
  }
  $('#go-paint').addEventListener('click', () => begin('paint'));
  $('#go-find').addEventListener('click', () => begin('find'));

  let holdTimer = 0;
  function exitToStart() {
    clearTimeout(holdTimer);
    home.classList.remove('holding');
    playing = false;
    if (synth) synth.cancel();
    sayId++; busy = false;
    reset();
    showHint();
    start.hidden = false;
    try { if (wake) wake.release(); } catch (e) {}
    wake = null;
  }
  home.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    home.classList.add('holding');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(exitToStart, 900);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) {
    home.addEventListener(ev, () => { clearTimeout(holdTimer); home.classList.remove('holding'); });
  }
  home.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); exitToStart(); } });

  reset();
  showHint();

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('../sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
